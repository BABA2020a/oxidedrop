<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Oxide Drop MiniApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: #0d0b14;
            color: #fff;
            margin: 0;
            padding: 15px 15px 90px;
            text-align: center;
            -webkit-user-select: none;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #181524, #221c38);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #3d2f5c;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: #b57cff; }
        .balance {
            font-size: 18px;
            color: #ffd700;
            margin-top: 10px;
            font-weight: bold;
        }

        .tab { display: none; }
        .tab.active { display: block; }

        .case-card, .profile-card {
            background-color: #161224;
            border-radius: 16px;
            border: 2px solid #2a2245;
            padding: 20px;
            margin: 20px auto;
            max-width: 360px;
        }

        .case-image { font-size: 50px; margin-bottom: 15px; }
        .btn-open {
            background: linear-gradient(90deg, #8a2be2, #4a00e0);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            width: 80%;
            cursor: pointer;
        }

        .win-alert {
            display: none;
            margin-top: 15px;
            font-size: 16px;
        }

        .section-title {
            color: #b57cff;
            margin: 0 0 10px;
            font-size: 20px;
        }

        .inventory-section {
            margin-top: 25px;
            text-align: left;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .inventory-slot {
            background-color: #161224;
            border: 1px solid #2a2245;
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #a3a3a3;
            text-align: center;
            padding: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .inventory-buttons {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-danger {
            background: linear-gradient(90deg, #d32f2f, #9a0007);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3);
        }

        .btn-danger-confirm {
            background: linear-gradient(90deg, #ff1744, #b2032a);
            display: none;
        }

        .inventory-slot.selected-to-delete {
            border: 2px solid #ff1744 !important;
            box-shadow: inset 0 0 10px rgba(255, 23, 68, 0.5);
            transform: scale(0.95);
        }

        /* Нижнее меню */
        .bottom-nav {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 10px;
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
            padding: 7px;
            background: rgba(22, 18, 36, .96);
            border: 1px solid #3d2f5c;
            border-radius: 18px;
            backdrop-filter: blur(10px);
        }

        .nav-btn {
            border: 0;
            border-radius: 13px;
            padding: 10px 5px;
            background: transparent;
            color: #8f8a9d;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .nav-btn.active {
            color: #fff;
            background: linear-gradient(135deg, #6d20bd, #3d00a8);
            box-shadow: 0 0 12px rgba(138, 43, 226, .35);
        }

        /* Профиль */
        .profile-avatar {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #8a2be2;
            margin-bottom: 10px;
            background: #221c38;
        }

        .profile-name {
            color: #fff;
            font-size: 21px;
            font-weight: bold;
            margin: 4px 0;
        }

        .profile-username {
            color: #b57cff;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .profile-row {
            background: #100d19;
            border: 1px solid #2a2245;
            border-radius: 12px;
            padding: 12px;
            margin-top: 9px;
            text-align: left;
        }

        .profile-row-label {
            color: #9b96a8;
            font-size: 12px;
        }

        .profile-row-value {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
            word-break: break-all;
        }

        .level-box {
            margin-top: 15px;
            padding: 15px;
            background: #100d19;
            border: 1px solid #4b2a70;
            border-radius: 13px;
        }

        .level-title {
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
        }

        .level-text {
            color: #c8c4d0;
            font-size: 13px;
            margin: 8px 0;
        }

        .progress {
            width: 100%;
            height: 11px;
            background: #292333;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #3d2f5c;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8a2be2, #c77dff);
            border-radius: 20px;
            transition: width .3s ease;
        }
    </style>
</head>
<body>

    <!-- ГЛАВНАЯ -->
    <section id="home-tab" class="tab active">
        <div class="header">
            <h1 id="username">OXIDE DROP</h1>
            <div class="balance">🪙 Баланс: <span id="balance-val">5000</span> коинов</div>
        </div>

        <div class="case-card">
            <div class="case-image">📦</div>
            <h2>Донатный Кейс</h2>
            <p style="color:#a3a3a3;">Стоимость: 500 коинов</p>
            <button class="btn-open" id="main-open-btn">ОТКРЫТЬ КЕЙС</button>
            <div class="win-alert" id="win-notification"></div>
        </div>
    </section>

    <!-- ИНВЕНТАРЬ -->
    <section id="inventory-tab" class="tab">
        <div class="header">
            <h1>🎒 ИНВЕНТАРЬ</h1>
            <div class="balance">🪙 <span id="balance-val-inventory">5000</span> коинов</div>
        </div>

        <div class="inventory-section">
            <h3 class="section-title">
                Ваши скины
                <span id="mode-status" style="font-size:12px;color:#a3a3a3;margin-left:5px;"></span>
            </h3>

            <div class="inventory-grid" id="inv-grid"></div>

            <div class="inventory-buttons">
                <button class="btn-danger" id="toggle-delete-mode-btn">🗑️ Выбрать скины для удаления</button>
                <button class="btn-danger btn-danger-confirm" id="confirm-delete-btn">⚠️ Удалить выбранные скины</button>
            </div>
        </div>
    </section>

    <!-- ПРОФИЛЬ -->
    <section id="profile-tab" class="tab">
        <div class="profile-card">
            <h2 class="section-title">👤 ПРОФИЛЬ</h2>

            <img id="profile-avatar" class="profile-avatar" src="" alt="Avatar" style="display:none;">
            <div id="avatar-placeholder" style="font-size:55px;">👤</div>

            <div class="profile-name" id="profile-name">Игрок</div>
            <div class="profile-username" id="profile-username">@username</div>

            <div class="profile-row">
                <div class="profile-row-label">🆔 Telegram ID</div>
                <div class="profile-row-value" id="profile-id">—</div>
            </div>

            <div class="level-box">
                <div class="level-title">⭐ Уровень <span id="profile-level">1</span></div>
                <div class="level-text">
                    Кейсов открыто: <span id="level-progress-text">0/10</span>
                </div>
                <div class="progress">
                    <div class="progress-fill" id="level-progress-fill"></div>
                </div>
            </div>

            <div class="profile-row">
                <div class="profile-row-label">📦 Всего открыто ящиков</div>
                <div class="profile-row-value" id="profile-cases">0</div>
            </div>

            <div class="profile-row">
                <div class="profile-row-label">⚙️ Апгрейдов</div>
                <div class="profile-row-value" id="profile-upgrades">0</div>
            </div>

            <div class="profile-row">
                <div class="profile-row-label">🪙 Баланс</div>
                <div class="profile-row-value"><span id="profile-balance">5000</span> коинов</div>
            </div>
        </div>
    </section>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-tab="home-tab">🏠<br>Главная</button>
        <button class="nav-btn" data-tab="inventory-tab">🎒<br>Инвентарь</button>
        <button class="nav-btn" data-tab="profile-tab">👤<br>Профиль</button>
    </nav>

    <script>
        let balance = 5000;
        const prizeList = ["Скин Oxide #1", "Скин Oxide #2", "Скин Oxide #3", "Скин Oxide #4"];
        let playerInventory = [];
        let selectedIndexesToDelete = [];
        let isDeleteMode = false;
        let openedCases = 0;

        let tg = null;
const API_URL = "https://oxidedrop-api.onrender.com";

        try {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();

            const user = tg.initDataUnsafe && tg.initDataUnsafe.user;

            if (user) {
                const displayName = user.username ? "@" + user.username : user.first_name;
                document.getElementById('username').innerText =
                    (user.first_name || "Игрок").toUpperCase() + " DROP";

                document.getElementById('profile-name').innerText =
                    user.first_name || "Игрок";

                document.getElementById('profile-username').innerText =
                    user.username ? "@" + user.username : "Username не указан";

                document.getElementById('profile-id').innerText =
                    user.id || "—";

                if (user.photo_url) {
                    document.getElementById('profile-avatar').src = user.photo_url;
                    document.getElementById('profile-avatar').style.display = "inline-block";
                    document.getElementById('avatar-placeholder').style.display = "none";
                }
            }
        } catch (e) {
            console.log("WebApp не в Telegram");
        }

        async function loadServerProfile() {
            if (!tg || !tg.initData) return;

            try {
                const response = await fetch(API_URL + "/api/player", {
                    method: "GET",
                    headers: {
                        "X-Telegram-Init-Data": tg.initData
                    }
                });

                if (!response.ok) throw new Error("API " + response.status);

                const data = await response.json();
                if (!data.ok || !data.player) throw new Error("Invalid profile response");

                const player = data.player;
                balance = Number(player.balance) || 0;
                openedCases = Number(player.total_cases_opened) || 0;
                playerInventory = Array.isArray(player.inventory) ? player.inventory : [];

                document.getElementById("profile-name").innerText = player.first_name || "Игрок";
                document.getElementById("profile-username").innerText = player.username ? "@" + player.username : "Username не указан";
                document.getElementById("profile-id").innerText = player.telegram_id || "—";

                syncBalanceUI();
                updateProfile();
                updateInventoryUI();
            } catch (error) {
                console.log("Не удалось загрузить профиль:", error);
            }
        }

        function syncBalanceUI() {
            document.getElementById('balance-val').innerText = balance;
            document.getElementById('balance-val-inventory').innerText = balance;
            document.getElementById('profile-balance').innerText = balance;
        }

        function updateProfile() {
            const level = Math.floor(openedCases / 10) + 1;
            const progress = openedCases % 10;

            document.getElementById('profile-level').innerText = level;
            document.getElementById('level-progress-text').innerText = progress + "/10";
            document.getElementById('level-progress-fill').style.width = (progress * 10) + "%";
            document.getElementById('profile-cases').innerText = openedCases;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });

            if (tabId !== "inventory-tab" && isDeleteMode) {
                toggleDeleteMode();
            }
        }

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        document.getElementById('main-open-btn').addEventListener('click', function() {
            if (isDeleteMode) toggleDeleteMode();

            const winBlock = document.getElementById('win-notification');

            if (balance < 500) {
                winBlock.style.display = "block";
                winBlock.innerHTML = "<span style='color:#ff3333;font-weight:bold;'>❌ Недостаточно коинов!</span>";
                return;
            }

            balance -= 500;
            openedCases++;

            syncBalanceUI();
            updateProfile();

            const randomPrize = prizeList[Math.floor(Math.random() * prizeList.length)];

            winBlock.style.display = "block";
            winBlock.innerHTML =
                `Выпало:<br><span style="color:#ffd700;font-size:18px;font-weight:bold;">${randomPrize}</span>`;

            playerInventory.push({ name: randomPrize });
            updateInventoryUI();
        });

        document.getElementById('toggle-delete-mode-btn').addEventListener('click', toggleDeleteMode);

        function toggleDeleteMode() {
            if (playerInventory.length === 0) {
                alert("Ваш инвентарь пуст! Нечего удалять.");
                return;
            }

            isDeleteMode = !isDeleteMode;
            selectedIndexesToDelete = [];

            const mainBtn = document.getElementById('toggle-delete-mode-btn');
            const confirmBtn = document.getElementById('confirm-delete-btn');
            const statusText = document.getElementById('mode-status');

            if (isDeleteMode) {
                mainBtn.innerText = "↩️ Отменить удаление";
                statusText.innerText = "(Выберите предметы кликом)";
                statusText.style.color = "#ff1744";
            } else {
                mainBtn.innerText = "🗑️ Выбрать скины для удаления";
                confirmBtn.style.display = "none";
                statusText.innerText = "";
            }

            updateInventoryUI();
        }

        function handleSlotClick(index) {
            if (!isDeleteMode) return;

            const itemPos = selectedIndexesToDelete.indexOf(index);

            if (itemPos > -1) {
                selectedIndexesToDelete.splice(itemPos, 1);
            } else {
                selectedIndexesToDelete.push(index);
            }

            const confirmBtn = document.getElementById('confirm-delete-btn');

            if (selectedIndexesToDelete.length > 0) {
                confirmBtn.style.display = "block";
                confirmBtn.innerText =
                    `⚠️ Удалить выбранные скины (${selectedIndexesToDelete.length} шт.)`;
            } else {
                confirmBtn.style.display = "none";
            }

            updateInventoryUI();
        }

        document.getElementById('confirm-delete-btn').addEventListener('click', function() {
            if (selectedIndexesToDelete.length === 0) return;

            const isConfirmed = confirm(
                `Вы уверены, что хотите навсегда удалить выбранные скины (${selectedIndexesToDelete.length} шт.)?`
            );

            if (isConfirmed) {
                playerInventory = playerInventory.filter(
                    (item, index) => !selectedIndexesToDelete.includes(index)
                );

                isDeleteMode = false;
                selectedIndexesToDelete = [];

                document.getElementById('toggle-delete-mode-btn').innerText =
                    "🗑️ Выбрать скины для удаления";
                document.getElementById('confirm-delete-btn').style.display = "none";
                document.getElementById('mode-status').innerText = "";

                updateInventoryUI();
            }
        });

        function updateInventoryUI() {
            const grid = document.getElementById('inv-grid');
            grid.innerHTML = "";

            playerInventory.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = "inventory-slot";

                if (isDeleteMode && selectedIndexesToDelete.includes(index)) {
                    slot.className += " selected-to-delete";
                } else {
                    slot.style.border = "1px solid #8a2be2";
                    slot.style.color = "#ffffff";
                }

                slot.innerText = item.name;
                slot.onclick = function() {
                    handleSlotClick(index);
                };

                grid.appendChild(slot);
            });

            while (grid.children.length < 4) {
                const emptySlot = document.createElement('div');
                emptySlot.className = "inventory-slot";
                emptySlot.innerText = "Пусто";
                grid.appendChild(emptySlot);
            }
        }

        syncBalanceUI();
        updateProfile();
        updateInventoryUI();
        loadServerProfile();
    </script>
</body>
</html>
